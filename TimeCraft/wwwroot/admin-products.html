<!DOCTYPE html>
<html>

<head>
    <title>TimeCraft - Manage Products</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="header-container"></div>


    <main class="admin-products-page">

        <div class="admin-products-header">

            <div>
                <p class="page-label">ADMIN PANEL</p>

                <h1>Manage Watches</h1>

                <p>
                    Add and manage watches available in the TimeCraft store.
                </p>
            </div>

        </div>


        <!-- Add Product -->

        <section class="product-form-card">

            <h2>Add New Watch</h2>

            <form id="productForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Watch Name</label>

                        <input type="text"
                               id="name"
                               placeholder="Enter watch name"
                               required>
                    </div>


                    <div class="form-group">
                        <label>Brand</label>

                        <input type="text"
                               id="brand"
                               placeholder="Enter brand"
                               required>
                    </div>


                    <div class="form-group">
                        <label>Category</label>

                        <select id="category" required>

                            <option value="">
                                Select category
                            </option>

                            <option value="Men">
                                Men
                            </option>

                            <option value="Women">
                                Women
                            </option>

                            <option value="Smart Watch">
                                Smart Watch
                            </option>

                            <option value="Premium">
                                Premium
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Price</label>

                        <input type="number"
                               id="price"
                               placeholder="Enter price"
                               min="1"
                               required>
                    </div>


                    <div class="form-group">
                        <label>Stock</label>

                        <input type="number"
                               id="stock"
                               placeholder="Enter stock"
                               min="0"
                               required>
                    </div>


                    <div class="form-group">
                        <label>Watch Image</label>

                        <input type="file"
                               id="image"
                               accept="image/*"
                               required>
                    </div>

                </div>


                <div class="form-group full-width">

                    <label>Description</label>

                    <textarea id="description"
                              placeholder="Enter watch description">
                    </textarea>

                </div>


                <button type="submit" class="primary-button">
                    Add Watch
                </button>


                <p id="productMessage"></p>

            </form>

        </section>


        <!-- Product List -->

        <section class="admin-product-list">

            <div class="section-heading">
                <h2>Available Watches</h2>
            </div>

            <div id="adminProducts"
                 class="admin-products-grid">
            </div>

        </section>

    </main>


    <div id="footer-container"></div>


    <script src="js/common-layout.js"></script>

    <script src="js/admin-product.js"></script>

</body>

</html>
