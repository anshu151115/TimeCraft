<!DOCTYPE html>
<html>

<head>

    <title>TimeCraft - Checkout</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="header-container"></div>


    <main class="checkout-page">

        <section class="checkout-heading">

            <p class="page-label">
                TIMECRAFT
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Complete your details and place your order.
            </p>

        </section>


        <div class="checkout-layout">


            <section class="checkout-form">

                <h2>
                    Shipping Details
                </h2>


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input type="text"
                           id="shippingName"
                           required>

                </div>

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phoneNumber"
                           placeholder="Enter your phone number"
                           required>

                </div>

                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <textarea id="shippingAddress"
                              required></textarea>

                </div>


                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input type="text"
                           id="shippingCity"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input type="text"
                           id="shippingState"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Pincode
                    </label>

                    <input type="text"
                           id="shippingPincode"
                           required>

                </div>


                <h2>
                    Payment
                </h2>


                <div class="payment-box">

                    <p>
                        Demo Online Payment
                    </p>

                    <p>
                        Clicking "Pay Now" will simulate a successful payment.
                    </p>

                </div>


                <button class="checkout-button"
                        onclick="placeOrder()">

                    Pay Now

                </button>

            </section>


            <aside class="checkout-summary">

                <h2>
                    Order Summary
                </h2>

                <div id="checkoutItems"></div>


                <div class="summary-row total-row">

                    <span>
                        Total
                    </span>

                    <span id="checkoutTotal">
                        ₹0
                    </span>

                </div>

            </aside>


        </div>

    </main>


    <div id="footer-container"></div>


    <script src="js/common-layout.js"></script>

    <script src="js/checkout.js"></script>

</body>

</html>
