<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeCraft - My Account</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <div id="header-container"></div>


    <main class="account-page">

        <div class="account-header">

            <p class="page-label">
                TIMECRAFT
            </p>

            <h1>My Account</h1>

            <p>
                Manage your profile and account settings.
            </p>

        </div>


        <div class="account-container">

            <!-- Profile Section -->
            <section class="account-card">

                <h2>Profile Information</h2>

                <p class="account-description">
                    View and update your personal information.
                </p>


                <form id="profileForm">

                    <div class="account-field">

                        <label for="name">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               required>

                    </div>


                    <div class="account-field">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               required>

                    </div>


                    <button type="submit"
                            class="account-button">
                        Save Changes
                    </button>

                </form>

            </section>


            <!-- Password Section -->
            <section class="account-card">

                <h2>Change Password</h2>

                <p class="account-description">
                    Keep your account secure by updating your password.
                </p>


                <form id="passwordForm">

                    <div class="account-field">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input type="password"
                               id="currentPassword"
                               required>

                    </div>


                    <div class="account-field">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input type="password"
                               id="newPassword"
                               required
                               minlength="6">

                    </div>


                    <div class="account-field">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input type="password"
                               id="confirmPassword"
                               required
                               minlength="6">

                    </div>


                    <button type="submit"
                            class="account-button">
                        Change Password
                    </button>

                </form>

            </section>

        </div>

    </main>


    <!-- Footer -->
    <div id="footer-container"></div>


    <script src="js/common-layout.js"></script>
    <script src="js/my-account.js"></script>

</body>

</html>
